  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* Custom CSS for Contact Section */
    #hero {
      background: linear-gradient(135deg, #2a3d4a, #1e2a30);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .overlay {
      background: rgba(26, 32, 38, 0.9);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      text-align: center;
      color: #fff;
      max-width: 500px;
      width: 90%;
      margin: 0 auto;
    }
    .overlay h2 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .row.gtr-uniform {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .col-6, .col-12 {
      width: 100%;
    }
    .col-6 input[placeholder="Name"]::placeholder {
      color: #ffffff;
    }
    .col-6 input[placeholder="Email"]::placeholder {
      color: #ffffff;
    }
    .col-6 input, .col-12 textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;        /* 🔹 added border */
      border-radius: 5px;
      background-color: rgba(2, 2, 2, 0.1);
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.6;
      outline: none;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .col-6 input:focus, .col-12 textarea:focus {
      background-color: rgba(255, 255, 255, 0.2);
      border-color: #ff4c60;          /* 🔹 border highlight on focus */
      box-shadow: 0 0 5px rgba(255, 76, 96, 0.5);
    }
    .col-12 textarea {
      resize: vertical;
      min-height: 100px;
    }
    .col-12 textarea[placeholder="Message"]::placeholder {
      color: #ffffff;
    }
    .actions.special {
      margin-top: 1rem;
    }
    .actions.special input[type="submit"].primary {
      background-color: #ff4c60;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 5px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .actions.special input[type="submit"].primary:hover {
      background-color: #e03e50;
    }
    footer {
      margin-top: 2rem;
    }
    .icons {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }
    .icons a {
      color: #fff;
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }
    .icons a:hover {
      color: #ff4c60;
    }
    .copyright {
      list-style: none;
      padding: 0;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
